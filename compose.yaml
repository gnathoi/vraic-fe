# Same stack as deploy/quadlets, for `docker compose up -d` or `podman compose up -d`.
# Needs .env (from .env.example) and the model in the jfe-models volume (deploy/fetch-model.sh).
name: jfe

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

x-app: &app
  image: localhost/jfe-app:latest
  build:
    context: .
    dockerfile: Containerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  env_file: .env
  read_only: true
  tmpfs: [/tmp]
  networks: [jfe-net]
  restart: always
  depends_on:
    jfe-db:
      condition: service_healthy

services:
  jfe-db:
    image: docker.io/library/postgres:17
    container_name: jfe-db
    env_file: .env
    environment:
      POSTGRES_USER: jfe
      POSTGRES_DB: jfe
    volumes: [jfe-pg:/var/lib/postgresql/data]
    networks: [jfe-net]
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jfe", "-d", "jfe"]
      interval: 10s

  # Qwen3-30B-A3B-Instruct-2507-FP8 on vLLM, capped at 80% of a 48 GB card; not published on the host.
  jfe-llm:
    <<: *gpu
    image: docker.io/vllm/vllm-openai:v0.30.0
    container_name: jfe-llm
    command: >-
      --model /models/qwen3-30b-a3b-instruct-2507-fp8 --served-model-name qwen3-30b-a3b-instruct --port 8000
      --max-model-len 16384 --gpu-memory-utilization 0.80 --max-num-seqs 16 --enable-prefix-caching
      --generation-config vllm
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    shm_size: 8g
    volumes: [jfe-models:/models:ro]
    networks: [jfe-net]
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      start_period: 600s

  # API + static frontend on http://localhost:8090; the GPU computes the start-up baseline (CPU fallback if absent).
  jfe-api:
    <<: [*app, *gpu]
    container_name: jfe-api
    command: uvicorn jfe.api:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=* --workers 1
    environment:
      JFE_LLM_URL: http://jfe-llm:8000/v1
    ports: ["127.0.0.1:8090:8000"]
    volumes: [jfe-artifacts:/data/artifacts]
    depends_on:
      jfe-db:
        condition: service_healthy
      jfe-llm:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s

  # Simulation worker: NumPy reference, CuPy on the GPU for large ensembles.
  jfe-worker:
    <<: [*app, *gpu]
    container_name: jfe-worker
    command: python -m jfe.worker

  # Report worker: briefing HTML, CSVs and ZIPs (CPU only).
  jfe-reports:
    <<: *app
    container_name: jfe-reports
    command: python -m jfe.worker --reports
    volumes: [jfe-artifacts:/data/artifacts]

networks:
  jfe-net:
    name: jfe-net

volumes:
  jfe-pg:
    name: jfe-pg
  jfe-artifacts:
    name: jfe-artifacts
  jfe-models:
    name: jfe-models
    external: true
