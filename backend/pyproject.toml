[project]
name = "jfe"
version = "0.1.0"
description = "Jersey Futures Engine - conversational, source-grounded demographic scenario engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
gpu = ["cupy-cuda13x[ctk]>=14.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jfe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
